<text x="46" y="144" fill="#38475b" font-family="system-ui,sans-serif" font-size="14">El usuario elige una región</text>
<text x="46" y="164" fill="#38475b" font-family="system-ui,sans-serif" font-size="14">La vista informa el identificador</text>
<rect x="335" y="90" width="300" height="110" rx="10" fill="#eaf1ff" stroke="#3757a4" stroke-opacity=".35"/>
<text x="351" y="119" fill="#3757a4" font-family="system-ui,sans-serif" font-size="17" font-weight="700">2 · Coordinador</text>
<text x="351" y="144" fill="#38475b" font-family="system-ui,sans-serif" font-size="14">pages/overview.js o explore.js</text>
<text x="351" y="164" fill="#38475b" font-family="system-ui,sans-serif" font-size="14">Decide qué debe actualizarse</text>
<rect x="700" y="90" width="365" height="110" rx="10" fill="#f2f4f7" stroke="#526173" stroke-opacity=".35"/>
<text x="716" y="119" fill="#526173" font-family="system-ui,sans-serif" font-size="17" font-weight="700">3 · Estado</text>
<text x="716" y="144" fill="#38475b" font-family="system-ui,sans-serif" font-size="14">Conserva la selección</text>
<text x="716" y="164" fill="#38475b" font-family="system-ui,sans-serif" font-size="14">No descarga ni dibuja</text>
<rect x="335" y="280" width="220" height="120" rx="10" fill="#fff6df" stroke="#a07413" stroke-opacity=".35"/>
<text x="351" y="309" fill="#a07413" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Datos</text>
<text x="351" y="334" fill="#38475b" font-family="system-ui,sans-serif" font-size="14">Carga lo necesario</text>
<text x="351" y="354" fill="#38475b" font-family="system-ui,sans-serif" font-size="14">Reutiliza índices y cachés</text>
<rect x="590" y="280" width="220" height="120" rx="10" fill="#e5f5ef" stroke="#2f765d" stroke-opacity=".35"/>
<text x="606" y="309" fill="#2f765d" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Vistas</text>
