<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Una acción, un recorrido claro</title><desc id="desc">Diagrama de la organización del Atlas sonoro de aves de Chile.</desc>
