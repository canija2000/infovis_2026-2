<rect width="1100" height="500" rx="16" fill="#fff"/>
<text x="30" y="42" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#233249">Una acción, un recorrido claro</text>
<polyline points="270,145 333,145" fill="none" stroke="#8b97a8" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="635,145 698,145" fill="none" stroke="#8b97a8" stroke-width="2" marker-end="url(#arrow)"/>
